version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/bastion"
    schedule:
      interval: weekly
    ignore:
      # Node majors are pinned via .nvmrc and bumped deliberately across
      # .nvmrc, CI, and this Dockerfile at once — not by dependabot.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
