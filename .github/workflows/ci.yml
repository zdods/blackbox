name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: v2.12.2

      - name: Build
        run: go build ./...

      - name: Test (race + coverage)
        run: go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Cross-compile daemon (all release targets)
        run: |
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              echo "::group::$os/$arch"
              GOOS=$os GOARCH=$arch go build -o /dev/null ./daemon
              echo "::endgroup::"
            done
          done

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blackhaul_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Integration tests (race + coverage)
        run: go test -tags=integration -race -coverprofile=coverage.integration.out ./bastion/
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/blackhaul_test?sslmode=disable

      - name: Coverage summary
        run: go tool cover -func=coverage.integration.out | tail -1

  web:
    name: Web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run lint

      - name: Svelte check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  web-e2e:
    name: Web e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Responsive layout tests (desktop + mobile viewports)
        run: npx playwright test

  web-e2e-passkey:
    name: Web e2e (passkey)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: blackhaul_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build bastion
        run: go build -o bastion-bin ./bastion

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build console
        working-directory: web
        run: npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      # The passkey suite drives a real bastion (no managed webServer). Each auth
      # mode needs a clean single-user DB, so we reset the schema, boot the
      # bastion in that mode, run the matching spec, then tear it down.
      - name: Passkey lifecycle (AUTH_MODE=passkey + both)
        working-directory: web
        env:
          PGPASSWORD: postgres
          JWT_SECRET: ci-passkey-secret-ci-passkey-secret-32x
          RP_ID: localhost
          RP_ORIGINS: http://localhost:8090
          RP_DISPLAY_NAME: Blackhaul
          SERVER_ADDR: ":8090"
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/blackhaul_e2e?sslmode=disable
        run: |
          run_mode () {
            local mode="$1" spec="$2"
            echo "::group::passkey e2e ($mode)"
            psql -h localhost -U postgres -d blackhaul_e2e -q \
              -c "DROP SCHEMA public CASCADE; CREATE SCHEMA public;"
            AUTH_MODE="$mode" STATIC_DIR="$PWD/build" ../bastion-bin > "bastion-$mode.log" 2>&1 &
            local pid=$!
            local up=0
            for _ in $(seq 1 60); do
              curl -fsS http://localhost:8090/healthz >/dev/null 2>&1 && up=1 && break
              sleep 0.5
            done
            if [ "$up" != 1 ]; then echo "bastion[$mode] failed to start"; cat "bastion-$mode.log"; return 1; fi
            E2E_BASE_URL=http://localhost:8090 \
              npx playwright test --config=playwright.passkey.config.js "$spec" --reporter=list
            local rc=$?
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "::endgroup::"
            return $rc
          }
          overall=0
          run_mode passkey e2e-passkey/passkey.spec.js || overall=1
          run_mode both e2e-passkey/both-mode.spec.js || overall=1
          exit $overall
