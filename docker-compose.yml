# Pin the compose project name so containers, volumes, and dev-built images
# are named blackhaul-* regardless of the checkout directory's name.
name: blackhaul

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-blackhaul}
    ports:
      # Bound to localhost: Postgres is reachable from the host for dev tooling
      # but never exposed to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"${POSTGRES_PASSWORD:-postgres}\" psql -U \"${POSTGRES_USER:-postgres}\" -d \"${POSTGRES_DB:-blackhaul}\" -w -c 'SELECT 1' || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10

  # blackhaul-server (serves blackhaul-console + daemon hub)
  # Default: published multi-arch image. To build from source with hot
  # reload, use the dev overlay (make dev / docker-compose.dev.yml).
  bastion:
    image: ghcr.io/zdods/blackhaul-bastion:${BASTION_IMAGE_TAG:-latest}
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-blackhaul}?sslmode=disable
      SERVER_ADDR: :8080
      # Unset JWT_SECRET = random ephemeral secret (secure, but sessions reset
      # on restart). Set JWT_SECRET in .env for production, or DEV_MODE=1 for a
      # stable dev secret across rebuilds (make dev does this).
      JWT_SECRET: ${JWT_SECRET:-}
      DEV_MODE: ${DEV_MODE:-}
    ports:
      - "${BASTION_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
