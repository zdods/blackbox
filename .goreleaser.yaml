# GoReleaser v2 — releases the daemon binaries on semver tags.
# The bastion ships as a Docker image (see .github/workflows/release.yml);
# only the daemon needs prebuilt binaries, since it runs on end-user machines.
version: 2

project_name: blackhaul

builds:
  - id: blackhaul-daemon
    main: ./daemon
    binary: blackhaul-daemon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X blackhaul/pkg/version.Version=v{{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - ids:
      - blackhaul-daemon
    name_template: "blackhaul-daemon_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - packaging/systemd/blackhaul-daemon.service
      - packaging/launchd/io.github.blackhaul.daemon.plist
      - packaging/windows/README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore\\(deps\\):"
      - "^docs:"
  groups:
    - title: Features
      regexp: "^feat"
      order: 0
    - title: Fixes
      regexp: "^fix"
      order: 1
    - title: Other
      order: 999

release:
  footer: |
    ---
    **Server image:** `docker pull ghcr.io/zdods/blackhaul-bastion:{{ .Version }}`
    **Daemon install:** `curl -fsSL https://raw.githubusercontent.com/zdods/blackhaul/main/install.sh | sh`

# Homebrew tap — a *formula* (not a cask) so `brew install zdods/tap/blackhaul-daemon`
# works on both macOS and Linux. Casks are macOS-only (Linuxbrew rejects them),
# whereas a formula's auto-generated on_macos/on_linux + on_arm/on_intel blocks
# select the right release archive per platform. Skipped automatically until the
# tap repo + token exist: set the TAP_GITHUB_TOKEN secret (a fine-grained PAT with
# contents:write on zdods/homebrew-tap) in this repo's Actions secrets.
brews:
  - name: blackhaul-daemon
    # NOTE: token is evaluated in env-only template mode — plain {{ .Env.X }}
    # only, no template functions (envOrDefault broke the v0.1.0 release).
    skip_upload: "{{ if .Env.TAP_GITHUB_TOKEN }}false{{ else }}true{{ end }}"
    repository:
      owner: zdods
      name: homebrew-tap
      branch: main
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/zdods/blackhaul
    description: Outbound-only file daemon for blackhaul — browse your machines from a hosted console with zero network config
    commit_msg_template: "blackhaul-daemon {{ .Tag }}"
    install: |
      bin.install "blackhaul-daemon"
    test: |
      system "#{bin}/blackhaul-daemon", "--version"
