<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#0c0d0f" />
		<meta name="description" content="blackhaul console — manage hosts and files" />
		<title>blackhaul [▪‿▪]</title>
		<link id="favicon" rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
		<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
		<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
		<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
		<link rel="manifest" href="/site.webmanifest" />
		<script>
			// Apply the persisted theme before first paint (kept in sync by $lib/theme.js).
			(function () {
				try {
					var choice = localStorage.getItem('blackhaul-theme');
					if (['light', 'dark', 'nord'].indexOf(choice) === -1) choice = 'system';
					var resolved =
						choice === 'system'
							? window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light'
							: choice;
					document.documentElement.setAttribute('data-theme', resolved);
					document.documentElement.style.colorScheme = resolved === 'light' ? 'light' : 'dark';
					var colors = { light: '#f7f7f5', dark: '#0c0d0f', nord: '#2e3440' };
					var accents = { light: '#0c8c5e', dark: '#3fd68c', nord: '#a3be8c' };
					var meta = document.querySelector('meta[name="theme-color"]');
					if (meta) meta.setAttribute('content', colors[resolved]);
					// Recolor the [▪‿▪] favicon to match the resolved theme. The
					// preload scanner fetches the link's default href before this
					// script runs, so mutating href is ignored on first paint —
					// replace the node instead to force a re-render (kept in sync
					// by $lib/theme.js, which does the same).
					var favicon = document.getElementById('favicon');
					if (favicon) {
						var bg = colors[resolved];
						var fg = accents[resolved];
						var svg =
							'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
							'<rect width="100" height="100" rx="20" fill="' +
							bg +
							'"/>' +
							'<g stroke="' +
							fg +
							'" stroke-width="6" fill="none">' +
							'<path d="M 24 28 H 16 V 72 H 24" stroke-linecap="square"/>' +
							'<path d="M 76 28 H 84 V 72 H 76" stroke-linecap="square"/>' +
							'<path d="M 44 58 Q 50 66 56 58" stroke-linecap="round"/></g>' +
							'<g fill="' +
							fg +
							'">' +
							'<rect x="28" y="40" width="12" height="12"/>' +
							'<rect x="60" y="40" width="12" height="12"/></g></svg>';
						var link = document.createElement('link');
						link.id = 'favicon';
						link.rel = 'icon';
						link.type = 'image/svg+xml';
						link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
						favicon.parentNode.replaceChild(link, favicon);
					}
				} catch (e) {
					document.documentElement.setAttribute('data-theme', 'dark');
				}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
